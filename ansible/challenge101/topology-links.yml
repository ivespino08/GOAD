---
# ansible/challenge101/topology-links.yml
# Configures r2r links on eth2+ (physical adapters from :networks in Vagrantfile).
#
# SCHEMA NOTE: this scenario's r2r_links use the Scenario3-style
# {"id":..., "ip":...} sub-object form (with edge_id), NOT Challenge5's
# plain-ID-string form — confirmed directly against this scenario's own
# PlanPreview.r2r_links_preview in the source XML, not assumed. This file
# is unchanged in logic from Scenario3's, only data_path differs.
#
# router-1 is the hub (degree 4 — appears in 4 of 6 r2r_links entries),
# same shape as Challenge5's router-1 hub problem noted in your build
# summary. That issue there was a schema mismatch (map(attribute='id')
# on plain strings), which doesn't apply here since this config already
# uses the {id,ip} sub-object form router-1 needs.

- import_playbook: ../data.yml
  vars:
    data_path: "../ad/Challenge101/data"
  tags: 'data'

- name: "Configure router-to-router links"
  hosts: routers
  become: true
  tasks:
    - include_role:
        name: "network/r2r_link"
      vars:
        _ids: "{{item.routers | map(attribute='id') | list}}"
        _ips: "{{item.routers | map(attribute='ip') | list}}"
        _peer_idx: "{{1 - _ids.index(dict_key)}}"
        local_router: "{{dict_key}}"
        local_ip4:   "{{_ips[_ids.index(dict_key)]}}"
        peer_router: "{{_ids[_peer_idx | int]}}"
        peer_ip4:    "{{_ips[_peer_idx | int]}}"
        link_subnet: "{{item.subnet}}"
        # eth0=NAT, eth1=management, eth2+=r2r (offset +2).
        interface_name: >-
          {{"eth" + (
            (lab.hosts[dict_key].r2r_interfaces.keys() | list).index(
              _ids[_peer_idx | int]
            ) + 2
          ) | string}}
      loop: "{{lab.topology.r2r_links}}"
      when: dict_key in (item.routers | map(attribute='id') | list)
      loop_control:
        label: "edge {{item.edge_id}} — {{item.subnet}}"
