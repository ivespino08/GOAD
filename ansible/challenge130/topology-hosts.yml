---
# Challenge130 / NewScenario22 — non-router host interface configuration.
# Each host gets its lab-network IP as a secondary address on eth1 (the same
# management interface used for 192.168.57.x).
#
# The default-route-to-LAN-gateway task used to live in this file too, but
# was pulled out into its own topology-gateway.yml, run LAST in this
# scenario's playbooks.yml sequence — see that file's header for why
# (same ordering bug already diagnosed for Challenge78: a gateway route set
# ahead of pending apt-based installs hijacks the NAT default route and
# breaks every later apt task on that host).

- import_playbook: ../data.yml
  vars:
    data_path: "../ad/Challenge130/data"
  tags: 'data'

- name: "Configure host lab-network addressing"
  hosts: pcs:servers:docker_nodes
  become: true
  tasks:
    # FIX (previously diagnosed for Scenario3/pc-4, never ported here): a
    # bare `ip addr add` is invisible to NetworkManager and gets silently
    # wiped by reboot.yml at the end of this scenario's playbook sequence,
    # with no error at boot time. Confirmed live on docker-1: lab IP and
    # LAN-gateway route both gone after reboot, NAT route left as the only
    # one present. network/persist_boot_commands wraps this in a systemd
    # oneshot unit so it both applies now AND re-applies on every future boot.
    - name: "Persist this host's lab-network IP as a secondary address on eth1"
      include_role:
        name: network/persist_boot_commands
      vars:
        persist_unit_name: "lab-ip-eth1"
        persist_description: "Persist lab IP on eth1 across reboots"
        persist_commands:
          - "ip addr add {{ lab.hosts[dict_key].ip4 }} dev eth1 || true"
