---
# ansible/challenge137/topology-routers.yml
# Adapted from Challenge101's topology-routers.yml — logic unchanged,
# only data_path differs. Interface layout per router VM:
#   eth0 = NAT (do not touch — Vagrant management)
#   eth1 = management 192.168.57.x (added by template :ip)
#   eth2.. = r2r links (added by template :networks, one per r2r_interfaces entry)
#
# Router LAN gateway IPs are added as secondary addresses on eth1,
# PERSISTENTLY, via a systemd oneshot unit (see roles/network/persist_boot_commands)
# — a bare `ip addr add` is invisible to NetworkManager and gets silently
# wiped on any reboot.
#
# router-5 has no attached host/switch in this scenario's topology (per
# the source XML's switches_detail — only routers 1-4 have an rsw-*
# entry). Same shape as Challenge101's router-5; it still gets a
# persisted lab.hosts ip4 like every other router (10.0.0.5/16, taken
# as-is from the source XML's PlanPreview), it just isn't anyone's
# gateway. No special-casing needed here; this play is generic over the
# routers group either way.

- import_playbook: ../data.yml
  vars:
    data_path: "../ad/Challenge137/data"
  tags: 'data'

- name: "Persist router LAN IP on eth1"
  hosts: routers
  become: true
  vars:
    dict_key: "{{inventory_hostname}}"
  roles:
    - role: 'network/persist_boot_commands'
      vars:
        persist_unit_name: "lab-ip-eth1"
        persist_description: "Persist router LAN gateway IP on eth1 across reboots"
        persist_commands:
          - "ip addr add {{lab.hosts[dict_key].ip4}} dev eth1 || true"
