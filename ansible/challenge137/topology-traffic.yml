---
# ansible/challenge137/topology-traffic.yml
# Logic unchanged from Challenge101's/Scenario3's — generic over
# lab.topology.traffic. This scenario has a single TCP flow (docker-2 ->
# docker-1, burst pattern, 128kbps) per the source XML's
# traffic_summary/Traffic section.
#
# FIX: originally deployed to /tmp/traffic (inherited from Challenge101,
# which inherited it from Scenario3) — confirmed broken on a real
# Challenge101 build (systemd stuck in an infinite restart loop, "Failed
# at step STDOUT spawning /usr/bin/python3: No such file or directory",
# because /tmp/traffic doesn't survive reboot.yml). Same fix ported here
# proactively rather than waiting to reproduce it: moved to /opt/traffic,
# matching every other scenario (Challenge70/101/130).

- import_playbook: ../data.yml
  vars:
    data_path: "../ad/Challenge137/data"
  tags: 'data'

- name: "Ensure /opt/traffic exists"
  hosts: domain
  become: true
  tasks:
    - ansible.builtin.file:
        path: /opt/traffic
        state: directory
        mode: "0755"

- name: "Deploy traffic sender scripts"
  hosts: domain
  become: true
  vars:
    dict_key: "{{inventory_hostname}}"
  tasks:
    - include_role:
        name: "network/traffic/sender"
      vars:
        flow: "{{item}}"
        src_ip4: "{{lab.hosts[dict_key].ip4 | ansible.utils.ipaddr('address')}}"
        dst_ip4: "{{lab.hosts[item.dst].ip4 | ansible.utils.ipaddr('address')}}"
        protocol: "{{item.protocol}}"
        rate_kbps: "{{item.rate_kbps}}"
        pattern: "{{item.pattern}}"
        script_dest: "/opt/traffic/traffic_{{dict_key}}_send{{loop_idx + 1}}.py"
      loop: >-
        {{
          lab.topology.traffic
          | selectattr('src', 'equalto', dict_key)
          | list
        }}
      loop_control:
        index_var: loop_idx
        label: "{{dict_key}} → {{item.dst}} ({{item.protocol}})"

- name: "Deploy traffic receiver scripts"
  hosts: domain
  become: true
  vars:
    dict_key: "{{inventory_hostname}}"
  tasks:
    - include_role:
        name: "network/traffic/receiver"
      vars:
        flow: "{{item}}"
        bind_ip4: "{{lab.hosts[dict_key].ip4 | ansible.utils.ipaddr('address')}}"
        protocol: "{{item.protocol}}"
        rate_kbps: "{{item.rate_kbps}}"
        pattern: "{{item.pattern}}"
        script_dest: "/opt/traffic/traffic_{{dict_key}}_recv{{loop_idx + 1}}.py"
      loop: >-
        {{
          lab.topology.traffic
          | selectattr('dst', 'equalto', dict_key)
          | list
        }}
      loop_control:
        index_var: loop_idx
        label: "{{dict_key}} receiving from {{item.src}} ({{item.protocol}})"

- name: "Start traffic scripts"
  hosts: domain
  become: true
  tasks:
    - include_role:
        name: "network/traffic/start"
      vars:
        traffic_script_dir: "/opt/traffic"
