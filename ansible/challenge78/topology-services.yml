- import_playbook: ../data.yml
  vars:
    data_path: "../ad/Challenge78/data"
  tags: 'data'

- name: "Resolve which physical interface holds each role (mgmt/r2r), MAC-based override if present"
  hosts: docker_nodes:pcs:servers
  become: true
  tasks:
    - include_role:
        name: network/resolve_iface_roles

# NOTE: the default-gateway play that used to live here has moved to
# topology-gateway.yml, run LAST in playbooks.yml (after topology-docker.yml
# and topology-traffic.yml). Setting each host's default route to its LAN
# gateway takes priority over the NAT default route on eth0 (a manually
# added route with no explicit metric wins over the DHCP-assigned NAT
# default), which silently killed internet reachability for every apt-based
# install that ran after it — including this file's own HTTP-service
# install and topology-docker.yml's Docker engine install. Every apt-based
# task in the whole scenario must run before any host's default route is
# repointed at its LAN gateway.

- name: "Install HTTP service on hosts advertising it"
  hosts: docker_nodes:pcs:servers
  become: true
  tags: 'services'
  tasks:
    - name: "Install apache2"
      ansible.builtin.apt:
        name: apache2
        state: present
        update_cache: yes
      when: "'HTTP' in lab.hosts[dict_key].services"

    - name: "Ensure apache2 is enabled and running"
      ansible.builtin.service:
        name: apache2
        state: started
        enabled: true
      when: "'HTTP' in lab.hosts[dict_key].services"

# interface_name resolved via network/resolve_iface_roles above -- falls
# back to the literal "eth1" for any host that never hit the
# PCI-bridge-overflow bug (see fix_router_netplan.py).
- name: "Configure DHCPClient service on hosts advertising it"
  hosts: docker_nodes:pcs:servers
  become: true
  tags: 'services'
  tasks:
    - name: "Configure network/services/dhcp_client"
      include_role:
        name: network/services/dhcp_client
      vars:
        interface_name: "{{ goad_mgmt_iface | default('eth1') }}"
        lan_subnet: "{{ lab.hosts[dict_key].lan_subnet }}"
        gateway_ip4: "{{ lab.hosts[dict_key].gateway }}"
      when: "'DHCPClient' in lab.hosts[dict_key].services"
