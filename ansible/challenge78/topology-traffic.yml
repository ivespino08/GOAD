- import_playbook: ../data.yml
  vars:
    data_path: "../ad/Challenge78/data"
  tags: 'data'

# Per the Challenge130 lesson: neither network/traffic/sender nor
# network/traffic/receiver create script_dest's parent directory
# themselves, so /opt/traffic is created explicitly before every
# sender/receiver pair below.

# Flow 1: docker-5 -> pc-6 (TCP, port 5011)
- name: "Traffic sender: docker-5 -> pc-6"
  hosts: docker-5
  become: true
  tags: 'traffic'
  tasks:
    - name: "Ensure /opt/traffic exists"
      ansible.builtin.file: { path: /opt/traffic, state: directory, mode: "0755" }
    - include_role:
        name: network/traffic/sender
      vars:
        flow: "docker5_to_pc6"
        src_ip4: "{{ lab.hosts['docker-5'].ip4 }}"
        dst_ip4: "{{ lab.hosts['pc-6'].ip4 }}"
        protocol: "TCP"
        rate_kbps: 128
        pattern: "continuous"
        script_dest: "/opt/traffic/traffic_docker5_to_pc6_sender.py"

- name: "Traffic receiver: docker-5 -> pc-6"
  hosts: pc-6
  become: true
  tags: 'traffic'
  tasks:
    - name: "Ensure /opt/traffic exists"
      ansible.builtin.file: { path: /opt/traffic, state: directory, mode: "0755" }
    - include_role:
        name: network/traffic/receiver
      vars:
        flow: "docker5_to_pc6"
        bind_ip4: "{{ lab.hosts['pc-6'].ip4 }}"
        protocol: "TCP"
        rate_kbps: 128
        pattern: "continuous"
        script_dest: "/opt/traffic/traffic_docker5_to_pc6_receiver.py"

