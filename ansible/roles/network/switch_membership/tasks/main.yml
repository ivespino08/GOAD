# roles/network/switch_membership/tasks/main.yml
---
- name: "Update apt cache before installing bridge-utils"
  ansible.builtin.apt:
    update_cache: yes
    cache_valid_time: 3600

- name: "Install bridge-utils, network-manager, and python3-netaddr"
  ansible.builtin.package:
    name:
      - bridge-utils
      - network-manager
      - python3-netaddr
    state: present

# CHANGED (Challenge43 session): ip4 now resolves from an explicit
# switch_gateway_ip4 var if the caller passes one, falling back to
# lab.hosts[dict_key].ip4 unchanged for any caller that doesn't (preserves
# Challenge130's exact prior behavior -- it never passes this var, and its
# config.json gives every router a single top-level ip4, so
# default(lab.hosts[dict_key].ip4) resolves exactly as before).
#
# Needed because this role assumed exactly one LAN switch per router (one
# router = one ip4 = one bridge). Challenge43's routers front up to two LAN
# switches each, so a single router-level ip4 can't disambiguate which
# switch's gateway address a given include_role call is for --
# topology-routers.yml now passes switch_gateway_ip4 explicitly per loop
# iteration over lan_switches instead.
- name: "Create bridge {{switch_name | regex_replace('[./]', '-')}}"
  ansible.builtin.nmcli:
    conn_name: "br-{{switch_name | regex_replace('[./]', '-')}}"
    ifname: "br-{{switch_name | regex_replace('[./]', '-')}}"
    type: bridge
    ip4: "{{ switch_gateway_ip4 | default(lab.hosts[dict_key].ip4) }}"
    autoconnect: yes
    state: present
  register: bridge_result

- name: "Bring up bridge {{switch_name | regex_replace('[./]', '-')}}"
  ansible.builtin.command:
    cmd: nmcli connection up "br-{{switch_name | regex_replace('[./]', '-')}}"
  when: bridge_result.changed

# PATCHED (Challenge43 session): same root cause and same fix pattern as
# roles/network/r2r_link's documented patch. generic/ubuntu2204's netplan
# renderer is networkd, and eth0 (Vagrant's own NAT adapter, pre-addressed
# by base-box provisioning before any of this repo's roles run) is already
# owned by netplan on this box image -- NetworkManager reports it "strictly
# unmanaged" and nmcli refuses to touch it, exactly like the r2r interfaces
# did before that role was patched.
#
# Unlike r2r_link, there's no netplan-applied bridge-membership to verify
# here (netplan only gives eth0 its NAT/DHCP address, nothing about
# bridging) -- so when eth0 is unmanaged, these two tasks are skipped
# rather than failing. This bridge's own address
# (switch_gateway_ip4/lab.hosts[dict_key].ip4) is already reachable via the
# secondary-IP-on-mgmt-interface task in topology-routers.yml regardless of
# whether eth0 ever gets attached as a slave, so a skip here does not by
# itself leave the router unaddressed on this LAN segment. Whether hosts on
# this switch still get real L2 connectivity to the router without the
# eth0 slave attached depends on how the VMware/Vagrant provider wires this
# switch's vmnet — not verified this session; if hosts on a LAN switch turn
# out to be unreachable from their router after this, that's the next
# thing to check, not assume this skip is sufficient on its own.

- name: "Check NetworkManager's management state for eth0"
  ansible.builtin.command:
    cmd: nmcli -t -f DEVICE,STATE device status
  register: nm_device_status
  changed_when: false

- name: "Set fact: is eth0 unmanaged (networkd/netplan owns it)?"
  ansible.builtin.set_fact:
    switch_eth0_unmanaged: "{{ ('eth0:unmanaged') in nm_device_status.stdout }}"

- name: "Attach LAN interface eth0 to bridge"
  ansible.builtin.nmcli:
    conn_name: "br-slave-eth0"
    ifname: "eth0"
    type: bridge-slave
    master: "br-{{switch_name | regex_replace('[./]', '-')}}"
    autoconnect: yes
    state: present
  register: slave_result
  when: not switch_eth0_unmanaged

- name: "Bring up bridge slave eth0"
  ansible.builtin.command:
    cmd: nmcli connection up "br-slave-eth0"
  when:
    - not switch_eth0_unmanaged
    - slave_result.changed | default(false)

- name: "eth0 is networkd-managed — bridge slave attachment skipped"
  ansible.builtin.debug:
    msg: >-
      eth0 is unmanaged by NetworkManager (networkd/netplan owns it), so it
      was not attached to br-{{switch_name | regex_replace('[./]', '-')}}
      as a bridge slave. The bridge itself still exists with its own IP;
      this only affects whether eth0 specifically is bonded into it.
  when: switch_eth0_unmanaged
