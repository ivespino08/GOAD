# roles/network/traffic/start/tasks/main.yml
#
# SECOND PATCH — the first attempt (wrapping `nohup ... &` in
# network/persist_boot_commands, a Type=oneshot + RemainAfterExit=yes unit)
# looked like it should work and did apply/enable cleanly, but confirmed
# dead on Challenge130's pc-3: `systemctl status` showed
# `active (exited)`/`status=0/SUCCESS` with `Tasks: 0` in the unit's
# cgroup — the wrapping `sh -c 'pgrep ... || nohup ... &'` process exits
# almost immediately (that's the whole point of nohup-and-background), and
# systemd tears down every process left in a oneshot unit's cgroup once
# that unit is considered "done" transitioning out of activating.
# RemainAfterExit=yes only keeps the *unit's reported state* as active —
# it does not protect orphaned children from that cleanup. nohup only
# guards against SIGHUP on terminal disconnect; it does nothing against a
# cgroup teardown. persist_boot_commands was built for quick, idempotent,
# run-and-exit-for-real commands (ip addr add, ip route add) — reusing it
# for a long-running daemon was the wrong tool for this case specifically.
#
# Fix: a dedicated Type=simple unit per script (traffic_script.service.j2)
# where systemd supervises the Python process directly as the unit's own
# main PID. No backgrounding, no nohup, no wrapping shell to be reaped —
# systemd IS the process supervisor here, used the way it's meant to be.
# Restart=on-failure covers a script that crashes; WantedBy=multi-user.target
# covers reboot persistence, the original problem this whole chain started
# from.

- name: "Find all traffic scripts on {{inventory_hostname}}"
  ansible.builtin.find:
    paths: "{{traffic_script_dir}}"
    patterns: "*.py"
  register: traffic_scripts

- name: "Deploy a dedicated systemd unit for each traffic script"
  ansible.builtin.template:
    src: traffic_script.service.j2
    dest: >-
      /etc/systemd/system/goad-traffic-{{ item.path | basename
                                           | regex_replace('\.py$', '')
                                           | regex_replace('[^A-Za-z0-9_-]', '_') }}.service
    mode: "0644"
  loop: "{{ traffic_scripts.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  register: traffic_unit_deploy

- name: "Reload systemd units"
  ansible.builtin.systemd:
    daemon_reload: yes
  when: traffic_unit_deploy.changed

- name: "Enable and (re)start each traffic script unit"
  ansible.builtin.systemd:
    name: >-
      goad-traffic-{{ item.item.path | basename
                       | regex_replace('\.py$', '')
                       | regex_replace('[^A-Za-z0-9_-]', '_') }}.service
    enabled: yes
    # state: restarted, not started -- a stale unit left over from the
    # first (oneshot/nohup) attempt would already report "active" under
    # its old definition, and `state: started` is a no-op against an
    # already-active unit regardless of whether its underlying file just
    # changed. Forcing a restart guarantees the new Type=simple config
    # actually takes effect the first time this runs against a host that
    # already has the old unit installed, not just on a fresh host.
    state: restarted
  loop: "{{ traffic_unit_deploy.results }}"
  loop_control:
    label: "{{ item.item.path | basename }}"

- name: "Confirm traffic scripts are running"
  ansible.builtin.shell:
    cmd: pgrep -f "python3 {{traffic_script_dir}}" | wc -l
  register: running_count
  changed_when: false

- name: "Report running traffic scripts"
  ansible.builtin.debug:
    msg: "{{running_count.stdout | trim}} traffic script(s) running on {{inventory_hostname}}"
